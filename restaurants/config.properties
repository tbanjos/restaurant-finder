# Glovo web API configuration.
#
# These endpoints are unofficial and tightly coupled to Glovo's web client.
# When Glovo deploys a new frontend, update the version/identity values here
# first, then run the test suite and a live smoke test.
#
# A different file can be selected with the GLOVO_CONFIG environment variable.
# A config.properties file in the current working directory also takes
# precedence over this packaged file.

api.store_wall_url=https://api.glovoapp.com/v1/web/store_wall/category/1
api.address_lookup_url=https://api.glovoapp.com/v3/addresslookup/pub/address
api.app_version=v1.2826.1
api.api_version=14
api.client_info=web-customer-web-react/v1.2826.1 project:customer-web
api.page_size=50
api.request_ttl=7500
api.referer=https://glovoapp.com/
api.user_agent=Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36
api.app_context=web
api.app_development_state=prod
api.app_platform=web
api.app_type=customer
api.perseus_consent=essential

# Search defaults used by the CLI and the default provider adapter.
# The default address and city can be overridden with DELIVERY_ADDRESS,
# DELIVERY_CITY, and DELIVERY_CITY_CODE (or their GLOVO_DEFAULT_* aliases.
defaults.city_code=mad
defaults.city_name=madrid
defaults.country_code=es
defaults.language=en
defaults.timeout=30
defaults.limit=30
defaults.sort=distance
