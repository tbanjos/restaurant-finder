[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glovo-restaurants"
version = "0.1.0"
description = "Find open Glovo restaurants by cuisine and delivery address, ranked by distance, rating, or delivery time."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
glovo-restaurants = "restaurants.adapters.inbound.cli:main"

[tool.setuptools.packages.find]
include = ["restaurants*"]

[tool.setuptools.package-data]
restaurants = ["config.properties"]
